[pytest]
# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for validators and utilities
    api: API integration tests
    integration: End-to-end integration tests
    e2e: Full user journey tests with browser automation
    smoke: Quick smoke tests for critical paths
    regression: Regression test suite
    auth: Authentication-related tests
    notes: Notes CRUD-related tests
    slow: Marks tests as slow (deselect with '-m "not slow"')

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --capture=no
    --disable-warnings

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0

# Asyncio mode for async tests
asyncio_mode = auto
